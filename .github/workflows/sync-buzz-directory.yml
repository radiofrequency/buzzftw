name: Sync Buzz directory

# Daily catalog refresh from https://buzz.directory/ plus optional
# S3 + CloudFront deploy. Does not recreate Fargate/ALB/RDS and does
# not touch folstad.ca DNS.

on:
  schedule:
    # 13:15 UTC — weekday-friendly morning in US timezones
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  MARKETING_BUCKET: buzzftw-com-marketing
  MARKETING_DISTRIBUTION_ID: EF2IOL0B900JI
  AWS_REGION: us-west-2
  SITE_URL: https://www.buzzftw.com

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync buzz.directory catalog
        run: npm run sync:directory

      - name: Commit catalog if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/marketplace-communities.generated.ts
          if git diff --cached --quiet; then
            echo "No community data changes."
            exit 0
          fi
          git commit -m "chore: sync buzz.directory communities [skip ci]"
          git push

      - name: Build Astro site
        env:
          PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.PUBLIC_COGNITO_USER_POOL_ID }}
          PUBLIC_COGNITO_CLIENT_ID: ${{ vars.PUBLIC_COGNITO_CLIENT_ID }}
          PUBLIC_COGNITO_REGION: ${{ vars.PUBLIC_COGNITO_REGION }}
          PUBLIC_COGNITO_DOMAIN: ${{ vars.PUBLIC_COGNITO_DOMAIN }}
          PUBLIC_BUZZ_API_URL: ${{ vars.PUBLIC_BUZZ_API_URL }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Deploy to S3 + CloudFront
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.PUBLIC_COGNITO_USER_POOL_ID }}
          PUBLIC_COGNITO_CLIENT_ID: ${{ vars.PUBLIC_COGNITO_CLIENT_ID }}
          PUBLIC_COGNITO_REGION: ${{ vars.PUBLIC_COGNITO_REGION }}
          PUBLIC_COGNITO_DOMAIN: ${{ vars.PUBLIC_COGNITO_DOMAIN }}
          PUBLIC_BUZZ_API_URL: ${{ vars.PUBLIC_BUZZ_API_URL }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: bash scripts/deploy-site.sh

      - name: Skip deploy (no AWS secrets)
        if: ${{ secrets.AWS_ACCESS_KEY_ID == '' || secrets.AWS_SECRET_ACCESS_KEY == '' }}
        run: |
          echo "AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are not set."
          echo "Skipping S3+CloudFront deploy."
          echo "Manual deploy: MARKETING_BUCKET=${MARKETING_BUCKET} MARKETING_DISTRIBUTION_ID=${MARKETING_DISTRIBUTION_ID} ./scripts/deploy-site.sh"
